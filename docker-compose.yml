services:
  wallet-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PERSISTENCE_URL: sqlite+aiosqlite:////app/data/wallet_agent.db
    volumes:
      - wallet-agent-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  wallet-agent-data:
