services:
  wallet-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Bundled default; a deployment overrides this from its own .env, which
      # Compose interpolates here. A separate variable name keeps the local
      # .env (sqlite, for ./scripts/start_local.sh) from silently changing what
      # the Compose stack uses.
      PERSISTENCE_URL: ${DEPLOY_PERSISTENCE_URL:-mysql://wallet_agent:wallet_agent@mysql:3306/wallet_agent}
      REDIS_URL: redis://redis:6379/0
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  demo-next:
    build:
      context: ./demo-next
      args:
        # The browser calls the API, so this must be reachable from the user's
        # browser rather than from inside the Compose network.
        NEXT_PUBLIC_AGENT_API_URL: ${NEXT_PUBLIC_AGENT_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      wallet-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    # Bundled database for the local stack. Deployments that point
    # DEPLOY_PERSISTENCE_URL at their own server leave this profile off, so no
    # unused MySQL container is started next to the managed one.
    profiles: ["bundled-db"]
    environment:
      MYSQL_DATABASE: wallet_agent
      MYSQL_USER: wallet_agent
      MYSQL_PASSWORD: wallet_agent
      MYSQL_ROOT_PASSWORD: wallet_agent-root
    volumes:
      - wallet-agent-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Legacy single-node Postgres backend. The stack now runs on MySQL; this stays
  # available behind a profile for anyone still testing against Postgres:
  #   docker compose --profile postgres up -d
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: wallet_agent
      POSTGRES_USER: wallet_agent
      POSTGRES_PASSWORD: wallet_agent
    volumes:
      - wallet-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_agent -d wallet_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - wallet-agent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  wallet-agent-mysql:
  wallet-agent-postgres:
  wallet-agent-redis:
