[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wallet-agent"
version = "0.1.0"
description = "Non-custodial wallet LangGraph service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "langgraph>=0.2,<1",
  "langchain-openai>=0.2,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "langgraph-checkpoint-sqlite>=2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_agent", "src/evals"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: tests that call external provider, RPC, or model services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
