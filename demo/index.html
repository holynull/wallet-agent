<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Agent · Chat Swap</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #edf2f7; }
    main { width: min(760px, 100%); min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #111821; }
    header { position: sticky; top: 0; z-index: 2; padding: 16px; border-bottom: 1px solid #283242; background: rgba(17, 24, 33, .96); backdrop-filter: blur(10px); }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 12px; color: #9aa8bb; font-size: 12px; }
    .wallet-bar { display: flex; align-items: center; gap: 8px; }
    .wallet-status { flex: 1; min-width: 0; color: #b9c5d6; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .token-input { width: 150px; min-width: 0; padding: 8px; border: 1px solid #3b4b63; border-radius: 8px; outline: none; color: #edf2f7; background: #0d141d; font: inherit; font-size: 11px; }
    .token-input:focus { border-color: #5c85e8; }
    button { border: 1px solid #4269c7; border-radius: 8px; padding: 9px 12px; color: white; background: #2f5fc9; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    button.secondary { border-color: #435166; background: #263142; }
    button:disabled { opacity: .5; cursor: wait; }
    #messages { flex: 1; padding: 18px 14px 120px; overflow-y: auto; }
    .message { display: flex; margin: 10px 0; }
    .message.user { justify-content: flex-end; }
    .bubble { max-width: 88%; padding: 11px 13px; border-radius: 14px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user .bubble { background: #2f5fc9; border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background: #202a37; border: 1px solid #304055; border-bottom-left-radius: 4px; }
    .message.system .bubble { width: 100%; color: #9aa8bb; background: transparent; font-size: 12px; text-align: center; }
    .card { width: 100%; margin: 8px 0; padding: 13px; border: 1px solid #344256; border-radius: 12px; background: #18212d; }
    .card h3 { margin: 0 0 9px; font-size: 14px; }
    .card p { margin: 6px 0; color: #bdc8d7; font-size: 12px; }
    .card pre { max-height: 220px; margin: 8px 0; padding: 10px; overflow: auto; border-radius: 8px; background: #0a0f15; color: #c9d5e5; font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .quote-grid { display: grid; gap: 8px; }
    .quote { padding: 10px; border: 1px solid #3b4b63; border-radius: 9px; background: #121a24; }
    .quote strong { display: block; margin-bottom: 4px; }
    .quote span { display: block; color: #afbdcf; font-size: 12px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .card-actions button { flex: 1; min-width: 150px; }
    .composer { position: fixed; bottom: 0; z-index: 2; width: min(760px, 100%); padding: 10px 12px 14px; border-top: 1px solid #283242; background: rgba(17, 24, 33, .97); }
    .composer-row { display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; min-height: 42px; max-height: 130px; resize: vertical; padding: 11px; border: 1px solid #3b4b63; border-radius: 9px; outline: none; color: #edf2f7; background: #0d141d; font: inherit; font-size: 14px; }
    textarea:focus { border-color: #5c85e8; }
    .meta { display: flex; gap: 8px; margin-top: 7px; color: #8493a7; font-size: 11px; }
    .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .debug-panel { margin: 12px 14px 0; border: 1px solid #344256; border-radius: 9px; background: #0d141d; }
    .debug-panel summary { padding: 9px 11px; color: #b9c5d6; cursor: pointer; font-size: 12px; }
    .debug-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 11px 10px; }
    .debug-actions button { width: auto; min-width: 120px; padding: 7px 10px; font-size: 12px; }
    .debug-panel pre { max-height: 300px; margin: 0; padding: 10px 11px; overflow: auto; border-top: 1px solid #283242; color: #b9c8dc; font-size: 11px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .agent-test-hint { margin: 0; padding: 0 11px 9px; color: #8493a7; font-size: 11px; line-height: 1.45; }
    .agent-test-list { border-top: 1px solid #283242; }
    .agent-test-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 9px 11px; border-bottom: 1px solid #202b39; }
    .agent-test-row:last-child { border-bottom: 0; }
    .agent-test-dot { width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: #66758a; }
    .agent-test-row.pass .agent-test-dot { background: #4cc38a; }
    .agent-test-row.blocked .agent-test-dot { background: #d6a84f; }
    .agent-test-row.fail .agent-test-dot { background: #e06c75; }
    .agent-test-row.running .agent-test-dot { background: #5c85e8; box-shadow: 0 0 0 3px rgba(92, 133, 232, .18); }
    .agent-test-name { min-width: 0; font-size: 12px; font-weight: 600; }
    .agent-test-detail { margin-top: 3px; color: #8493a7; font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .agent-test-status { color: #b9c5d6; font-size: 11px; white-space: nowrap; }
    @media (max-width: 640px) { header { padding: 13px 12px; } #messages { padding-left: 10px; padding-right: 10px; } .bubble { max-width: 94%; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Wallet Agent Mobile Demo</h1>
    <p>通过自然语言兑换 · 浏览器钱包只在本地签名和广播 · private key 永远不会发送到服务端</p>
    <div class="wallet-bar">
      <div id="walletStatus" class="wallet-status">未连接浏览器钱包</div>
      <input id="token" class="token-input" type="password" autocomplete="off" placeholder="Bearer token（可选）" aria-label="Bearer token">
      <button id="connectButton">连接钱包</button>
      <button id="refreshButton" class="secondary" hidden>刷新</button>
    </div>
  </header>

  <details id="debugPanel" class="debug-panel">
    <summary>后端调试数据（0 条）</summary>
    <div class="debug-actions">
      <button id="debugSmokeButton" class="secondary" type="button">联调检查</button>
      <button id="debugClearButton" class="secondary" type="button">清空</button>
    </div>
    <pre id="debugOutput">等待后端响应…</pre>
  </details>

  <details id="agentTestPanel" class="debug-panel">
    <summary>Agent 功能测试（未运行）</summary>
    <div class="debug-actions">
      <button id="runAgentTestsButton" type="button">测试全部 Agent 功能</button>
    </div>
    <p class="agent-test-hint">只验证 Agent 分支、后端数据和签名前边界；不会自动签名、Approve 或广播交易。</p>
    <div id="agentTestResults" class="agent-test-list"></div>
  </details>

  <section id="messages" aria-live="polite"></section>

  <section class="composer">
    <div class="composer-row">
      <textarea id="composer" placeholder="例如：把 1 USDC 从 Base 换成 BSC 上的 USDT" aria-label="消息"></textarea>
      <button id="sendButton">发送</button>
    </div>
    <div class="meta">
      <span id="conversationMeta">conversation: 新会话</span>
      <span id="sessionMeta">session: 未创建</span>
    </div>
  </section>
</main>
<script>
  const state = {
    provider: null, providerInfo: null, address: null, chainId: null, chain: null,
    conversationId: null, sessionId: null, runId: null, streamAbort: null,
    quotes: [], selectedProviderReference: null, lastResponse: null, boundProvider: null,
    debugLog: [], agentTestResults: {}, typingQueue: Promise.resolve()
  };
  const $ = (id) => document.getElementById(id);
  const messages = $('messages');
  const knownChains = {
    '0x1': 'ETH', '0x38': 'BSC', '0x89': 'POLYGON',
    '0xa': 'OPTIMISM', '0x2105': 'BASE', '0xa4b1': 'ARBITRUM'
  };

  function json(value) { return JSON.stringify(value, null, 2); }
  function recordDebug(type, data) {
    state.debugLog.push({
      time: new Date().toISOString(),
      type,
      data
    });
    if (state.debugLog.length > 100) state.debugLog.shift();
    const panel = $('debugPanel');
    $('debugOutput').textContent = state.debugLog.map((item) => `[${item.time}] ${item.type}\n${json(item.data)}`).join('\n\n');
    panel.querySelector('summary').textContent = `后端调试数据（${state.debugLog.length} 条）`;
  }
  function clearDebug() {
    state.debugLog = [];
    $('debugOutput').textContent = '等待后端响应…';
    $('debugPanel').querySelector('summary').textContent = '后端调试数据（0 条）';
  }
  function chainName(chainId) { return knownChains[String(chainId).toLowerCase()] || `EVM(${chainId})`; }
  function chainIdNumber(chainId) { return Number.parseInt(String(chainId), String(chainId).startsWith('0x') ? 16 : 10); }
  const knownChainIds = Object.fromEntries(Object.entries(knownChains).map(([id, name]) => [name, chainIdNumber(id)]));
  function addMessage(role, text, content = null) {
    const row = document.createElement('div'); row.className = `message ${role}`;
    const bubble = document.createElement('div'); bubble.className = 'bubble';
    if (content) bubble.append(content); else bubble.textContent = text == null ? '' : String(text);
    row.append(bubble); messages.append(row); messages.scrollTop = messages.scrollHeight; return row;
  }
  function addTypingMessage(text) {
    const row = addMessage('assistant', '');
    const bubble = row.querySelector('.bubble');
    const value = text == null ? '' : String(text);
    state.typingQueue = state.typingQueue.catch(() => {}).then(async () => {
      for (const character of value) {
        bubble.textContent += character;
        messages.scrollTop = messages.scrollHeight;
        await new Promise((resolve) => setTimeout(resolve, 15));
      }
    });
    return state.typingQueue;
  }
  function addSystem(text) { addMessage('system', text); }
  function addCard(key, card) {
    const existing = messages.querySelector(`[data-card-key="${key}"]`);
    const row = document.createElement('div'); row.className = 'message assistant'; row.dataset.cardKey = key;
    const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.append(card); row.append(bubble);
    if (existing) existing.replaceWith(row); else messages.append(row);
    messages.scrollTop = messages.scrollHeight;
  }
  function disableWalletActions() {
    messages.querySelectorAll('[data-wallet-action="true"]').forEach((button) => { button.disabled = true; });
  }
  function resetWalletSession() {
    state.conversationId = null; state.sessionId = null; state.runId = null;
    state.quotes = []; state.selectedProviderReference = null; state.lastResponse = null;
    if (state.streamAbort) state.streamAbort.abort();
    disableWalletActions(); updateMeta();
  }
  function authHeaders() {
    const token = $('token').value.trim();
    return token ? { Authorization: `Bearer ${token}` } : {};
  }
  function jsonHeaders() { return { ...authHeaders(), 'Content-Type': 'application/json' }; }
  async function api(path, options = {}) {
    const response = await fetch(path, options);
    const raw = await response.text();
    let body;
    try { body = raw ? JSON.parse(raw) : {}; } catch { body = { raw }; }
    recordDebug(`API ${options.method || 'GET'} ${path} · ${response.status}`, body);
    if (!response.ok) throw new Error(JSON.stringify(body));
    return body;
  }
  function updateMeta() {
    $('conversationMeta').textContent = `conversation: ${state.conversationId || '新会话'}`;
    $('sessionMeta').textContent = `session: ${state.sessionId || '未创建'}`;
  }
  function updateWalletStatus() {
    if (!state.address) {
      $('walletStatus').textContent = '未连接浏览器钱包'; $('connectButton').textContent = '连接钱包'; return;
    }
    const walletName = state.providerInfo?.name || '浏览器钱包';
    $('walletStatus').textContent = `${walletName} · ${state.chain || 'EVM'} · ${state.address.slice(0, 6)}…${state.address.slice(-4)}`;
    $('connectButton').textContent = '重新连接';
  }

  function providerText(info, provider, source = '') {
    return [
      source, info?.name, info?.rdns, info?.uuid,
      provider?.name, provider?.providerName, provider?.walletName,
      provider?._name, provider?.isCatWallet, provider?.isCatwallet, provider?._isCatWallet
    ].filter((value) => value != null).join(' ').toLowerCase();
  }
  function isCatWallet(info, provider, source = '') {
    const markers = [
      provider?.isCatWallet, provider?.isCatwallet, provider?._isCatWallet,
      provider?.providerName, provider?.walletName, provider?.name
    ];
    return markers.some((value) => value === true || (
      typeof value === 'string' && value.toLowerCase().includes('catwallet')
    )) || providerText(info, provider, source).includes('catwallet')
      || providerText(info, provider, source).includes('cat wallet');
  }
  function providerEntry(info, provider, source = '') {
    if (!provider || typeof provider.request !== 'function') return null;
    const fallbackInfo = isCatWallet(info, provider, source) ? { name: 'CatWallet' } : null;
    return { info: info || fallbackInfo, provider, source };
  }
  function isCatWalletEntry(entry) {
    return Boolean(entry && isCatWallet(entry.info, entry.provider, entry.source));
  }
  function providerPriority(entry) {
    if (isCatWalletEntry(entry)) return 0;
    if (entry?.source?.includes('window.ethereum') && !entry.source.includes('providers')) return 2;
    if (entry?.source?.includes('window.ethereum.providers')) return 3;
    if (entry?.source?.includes('eip6963')) return 4;
    return 5;
  }
  function rememberProvider(info, provider, source = '') {
    const entry = providerEntry(info, provider, source);
    if (!entry) return;
    window.__walletProviders ||= [];
    const existing = window.__walletProviders.find((item) => item.provider === provider);
    if (existing) {
      existing.info ||= entry.info;
      existing.source = [existing.source, entry.source].filter(Boolean).join(' ');
    } else {
      window.__walletProviders.push(entry);
    }
    const selected = chooseProvider();
    if (selected && (!state.provider || !state.address)) {
      state.provider = selected.provider;
      state.providerInfo = selected.info;
    }
  }
  function chooseProvider() {
    const entries = window.__walletProviders || [];
    return entries.slice().sort((left, right) => providerPriority(left) - providerPriority(right))[0] || null;
  }
  function requestWalletProviders() {
    window.dispatchEvent(new Event('eip6963:requestProvider'));
  }
  function rememberInjectedProviders() {
    rememberProvider(null, window.catWallet, 'window.catWallet');
    rememberProvider(null, window.catwallet, 'window.catwallet');
    const injectedProviders = Array.isArray(window.ethereum?.providers)
      ? window.ethereum.providers : [];
    injectedProviders.forEach((provider) => {
      rememberProvider(null, provider, 'window.ethereum.providers');
    });
    rememberProvider(null, window.ethereum, 'window.ethereum');
  }
  function discoverWalletProviders() {
    window.__walletProviders = [];
    window.addEventListener('eip6963:announceProvider', (event) => {
      rememberProvider(event.detail?.info, event.detail?.provider, 'eip6963');
    });
    rememberInjectedProviders();
    requestWalletProviders();
  }
  async function waitForProvider() {
    rememberInjectedProviders();
    requestWalletProviders();
    const deadline = Date.now() + 1200;
    while (Date.now() < deadline) {
      rememberInjectedProviders();
      const current = chooseProvider();
      if (current && isCatWalletEntry(current)) return current;
      await new Promise((resolve) => setTimeout(resolve, 100));
    }
    return chooseProvider();
  }

  async function connectWallet() {
    const selected = await waitForProvider();
    if (!selected) {
      addMessage('assistant', '没有检测到浏览器钱包插件。请安装 CatWallet、MetaMask、Rabby 或其他 EIP-1193 钱包。'); return;
    }
    try {
      state.provider = selected.provider;
      state.providerInfo = selected.info;
      bindWalletEvents();
      const accounts = await state.provider.request({ method: 'eth_requestAccounts' });
      if (!accounts?.[0]) throw new Error('钱包没有返回账户');
      const nextAddress = accounts[0];
      const nextChainId = await state.provider.request({ method: 'eth_chainId' });
      const walletChanged = state.address && (state.address !== nextAddress || state.chainId !== nextChainId);
      state.address = nextAddress; state.chainId = nextChainId; state.chain = chainName(state.chainId);
      if (walletChanged) resetWalletSession();
      updateWalletStatus(); $('refreshButton').hidden = false;
      addSystem(`钱包已连接：${state.chain} ${state.address}`);
    } catch (error) { addMessage('assistant', `连接钱包失败：${error.message || error}`); }
  }
  function bindWalletEvents() {
    const provider = state.provider;
    if (!provider?.on || state.boundProvider === provider) return;
    state.boundProvider = provider;
    provider.on('accountsChanged', (accounts) => {
      state.address = accounts?.[0] || null; resetWalletSession();
      updateWalletStatus(); updateMeta(); addSystem(state.address ? '钱包账户已切换，请重新确认兑换信息。' : '钱包已断开。');
    });
    provider.on('chainChanged', (chainId) => {
      state.chainId = chainId; state.chain = chainName(chainId);
      updateWalletStatus(); updateMeta(); addSystem(`网络已切换为 ${state.chain}，当前兑换会话仍然保留。`);
    });
  }
  function walletMetadata() { return state.address ? { wallet_chain_id: state.chainId } : {}; }

  async function readSse(runId, options = {}) {
    const signal = options.signal || state.streamAbort?.signal;
    const response = await fetch(`/v1/agent/stream/${runId}`, { headers: authHeaders(), signal });
    if (!response.ok) {
      const raw = await response.text();
      recordDebug(`SSE CONNECT ${runId} · ${response.status}`, { raw });
      throw new Error(raw);
    }
    recordDebug(`SSE CONNECT ${runId} · ${response.status}`, { headers: Object.fromEntries(response.headers.entries()) });
    const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
    const events = [];
    while (true) {
      const chunk = await reader.read(); if (chunk.done) break; buffer += decoder.decode(chunk.value, { stream: true });
      const frames = buffer.split('\n\n'); buffer = frames.pop() || '';
      for (const frame of frames) {
        const event = (frame.match(/^event: (.+)$/m) || [])[1] || 'message'; const data = (frame.match(/^data: (.+)$/m) || [])[1] || '{}';
        let parsed; try { parsed = JSON.parse(data); } catch { parsed = { data }; }
        recordDebug(`SSE ${event}`, parsed);
        const current = applyEvent(event, parsed, options.apply !== false);
        events.push({ event, payload: parsed, state: current });
      }
    }
    if (buffer.trim()) recordDebug('SSE trailing data', buffer);
    return events;
  }
  function responseState(data) {
    const current = data?.state || data?.data?.state || data?.data || data;
    if (current?.response?.response && typeof current.response.response === 'object') {
      return { ...current, response: current.response.response };
    }
    return current;
  }
  function applyEvent(event, data, shouldRender = true) {
    const current = responseState(data);
    if (shouldRender && current?.session_id) state.sessionId = current.session_id;
    if (shouldRender && Array.isArray(current?.quote_candidates)) { state.quotes = current.quote_candidates; renderQuotes(); }
    if (shouldRender && current?.selected_provider_reference) state.selectedProviderReference = current.selected_provider_reference;
    if (shouldRender && current?.active_task) renderActiveTask(current.active_task);
    if (shouldRender && current?.response) renderResponse(current.response);
    if (shouldRender && (current?.preflight || current?.response?.preflight)) {
      renderPreflight(current.preflight || current.response.preflight);
    }
    if (shouldRender && current?.approval_transaction) renderApproval(current.approval_transaction);
    if (shouldRender && current?.confirmation_state?.status === 'requested' && current?.response?.kind !== 'confirmation_required') {
      renderConfirmation(current.confirmation_state, current.selected_quote || current.quote);
    }
    if (shouldRender && current?.pending_transaction) {
      if (current.response?.kind === 'transfer_prepare') renderTransfer(current.pending_transaction);
      else renderSwap(current.pending_transaction);
    }
    if (shouldRender && event === 'error') addTypingMessage(current?.error?.message || 'Agent 执行失败。');
    if (shouldRender) updateMeta();
    return current;
  }
  function renderActiveTask(task) {
    const fingerprint = json(task);
    if (fingerprint === state.lastActiveTask) return;
    state.lastActiveTask = fingerprint;
    const slots = Object.entries(task.slots || {})
      .map(([key, value]) => `${key}: ${value}`)
      .join(' · ');
    const missing = (task.missing_fields || []).join('、');
    const status = `${task.kind || 'wallet'} · ${task.stage || task.status || 'active'} · r${task.revision ?? 0}`;
    addTypingMessage([
      `当前任务：${status}`,
      slots ? `已保留：${slots}` : '',
      missing ? `还需要：${missing}` : '',
    ].filter(Boolean).join('\n'));
  }
  function renderResponse(response) {
    const fingerprint = json(response); if (fingerprint === state.lastResponse) return; state.lastResponse = fingerprint;
    if (response.kind === 'clarification') {
      const missing = (response.missing_fields || []).join('、');
      addTypingMessage(response.message || (
        missing ? `还需要补充：${missing}` : '你好！请告诉我你想查询余额、转账或兑换什么。'
      ));
      if (Array.isArray(response.token_candidates) && response.token_candidates.length) {
        renderTokenCandidates(response.token_candidates);
      }
    }
    else if (response.kind === 'error') addTypingMessage((response.errors || []).map((item) => item.message || item.code).join('\n') || '请求失败。');
    else if (response.kind === 'swap_quote') {
      const quotes = response.quotes || [];
      addTypingMessage(quotes.length
        ? `我找到了 ${quotes.length} 个兑换报价，请比较后选择一个 Provider。`
        : '暂时没有找到可用的兑换报价。');
    }
    else if (response.kind === 'confirmation_required') {
      addTypingMessage('报价已准备好，请确认兑换摘要后继续。');
      renderConfirmation(response.confirmation, response.quote);
    }
    else if (response.kind === 'transaction_status') {
      const status = typeof response.status === 'object'
        ? (response.status.status || response.status.state || 'unknown')
        : (response.status || 'unknown');
      const messages = {
        pending: '交易已经提交，正在等待链上确认。',
        confirmed: '交易已确认，资产状态应该很快同步到钱包。',
        completed: '兑换已完成，可以在目标链查看到账资产。',
        failed: '交易执行失败或已回滚，请检查交易详情和余额。',
        timed_out: '暂时还没有等到 Provider 的最终结果，可以稍后再次查询。',
        unknown: '暂时无法确定交易状态，建议稍后重试查询。'

      id: 'swap_status', name: '兑换订单状态', intent: 'swap_status', message: '测试兑换订单状态分支',
      expectedKinds: ['swap_status']
    }
  ];
  const agentTestStatusText = {
    idle: '未运行',
    running: '运行中',
    pass: '通过',
    blocked: '阻塞',
    fail: '失败'
  };
  const blockedAgentCodes = new Set([
    'CHAIN_CAPABILITY_UNAVAILABLE',
    'PRICE_PROVIDER_UNAVAILABLE',
    'ASSET_PROVIDER_UNAVAILABLE',
    'PROVIDER_UNAVAILABLE',
    'PROVIDER_QUOTE_FAILED',
    'PROVIDER_PREPARE_FAILED',
    'PROVIDER_REGISTER_FAILED',
    'PROVIDER_STATUS_FAILED',
    'WALLET_QUERY_FAILED',
    'PORTFOLIO_QUERY_FAILED',
    'GAS_CHECK_FAILED',
    'PRICE_QUERY_FAILED',
    'TRANSACTION_STATUS_FAILED',
    'ASSET_DISCOVERY_FAILED',
    'TRANSFER_PREPARE_FAILED'
  ]);
  function renderAgentTestList() {
    const container = $('agentTestResults');
    container.replaceChildren();
    for (const spec of agentTestSpecs) {
      const result = state.agentTestResults[spec.id] || { status: 'idle', detail: '未运行' };
      const row = document.createElement('div');
      row.className = `agent-test-row ${result.status}`;
      row.dataset.agentTestId = spec.id;
      const dot = document.createElement('span'); dot.className = 'agent-test-dot';
      const body = document.createElement('div');
      const name = document.createElement('div'); name.className = 'agent-test-name'; name.textContent = `${spec.name} · ${spec.intent}`;
      const detail = document.createElement('div'); detail.className = 'agent-test-detail'; detail.textContent = result.detail || '';
      body.append(name, detail);
      const status = document.createElement('span'); status.className = 'agent-test-status'; status.textContent = agentTestStatusText[result.status] || result.status;
      row.append(dot, body, status); container.append(row);
    }
  }
  function updateAgentTestSummary() {
    const values = Object.values(state.agentTestResults);
    const counts = values.reduce((result, item) => {
      result[item.status] = (result[item.status] || 0) + 1;
      return result;
    }, {});
    const summary = $('agentTestPanel').querySelector('summary');
    if (!values.length) {
      summary.textContent = 'Agent 功能测试（未运行）';
      return;
    }
    summary.textContent = `Agent 功能测试（通过 ${counts.pass || 0} · 阻塞 ${counts.blocked || 0} · 失败 ${counts.fail || 0}）`;
  }
  function errorCodes(value, result = new Set()) {
    if (!value || typeof value !== 'object') return result;
    if (typeof value.code === 'string') result.add(value.code);
    if (Array.isArray(value)) value.forEach((item) => errorCodes(item, result));
    else Object.values(value).forEach((item) => errorCodes(item, result));
    return result;
  }
  function stateFromTestEvents(events) {
    for (let index = events.length - 1; index >= 0; index -= 1) {
      if (events[index]?.state && typeof events[index].state === 'object') return events[index].state;
    }
    return {};
  }
  function classifyAgentTest(spec, result) {
    const states = (result.events || []).map((item) => item.state).filter((item) => item && typeof item === 'object');
    const finalState = stateFromTestEvents(result.events || []);
    const codes = [...errorCodes(result.error), ...errorCodes(result.events || [])];
    const uniqueCodes = [...new Set(codes)];
    const kinds = states.flatMap((item) => [item.kind, item.response?.kind]).filter(Boolean);
    const stages = states.flatMap((item) => [item.stage, item.response?.stage]).filter(Boolean);
    const hasQuote = states.some((item) => (
      (Array.isArray(item.quote_candidates) && item.quote_candidates.length > 0)
      || (Array.isArray(item.response?.quotes) && item.response.quotes.length > 0)
    ));
    const hasPrices = states.some((item) => (
      (Array.isArray(item.prices) && item.prices.length > 0)
      || (Array.isArray(item.response?.prices) && item.response.prices.length > 0)
    ));
    const hasAssets = states.some((item) => (
      (Array.isArray(item.assets) && item.assets.length > 0)
      || (Array.isArray(item.response?.assets) && item.response.assets.length > 0)
    ));
    const expectedKind = (spec.expectedKinds || []).find((kind) => kinds.includes(kind));
    const expectedStage = (spec.expectedStages || []).find((stage) => stages.includes(stage));
    if (expectedKind && (!spec.requiresQuote || hasQuote) && (!spec.requiresPrices || hasPrices) && (!spec.requiresAssets || hasAssets)) {
      return { status: 'pass', detail: `返回 ${expectedKind}${uniqueCodes.length ? ` · ${uniqueCodes.join(', ')}` : ''}`, codes: uniqueCodes, finalState };
    }
    if (expectedKind && spec.requiresPrices && !hasPrices && !uniqueCodes.length) {
      return { status: 'blocked', detail: '到达价格查询分支，但未返回价格数据。', codes: uniqueCodes, finalState };
    }
    if (expectedKind && spec.requiresAssets && !hasAssets && !uniqueCodes.length) {
      return { status: 'blocked', detail: '到达资产发现分支，但未返回资产数据。', codes: uniqueCodes, finalState };
    }
    if (expectedKind && spec.requiresQuote && !hasQuote && !uniqueCodes.length) {
      return { status: 'blocked', detail: '到达兑换报价分支，但未返回候选报价。', codes: uniqueCodes, finalState };
    }
    if (expectedStage) {
      return { status: 'pass', detail: `到达 ${expectedStage}`, codes: uniqueCodes, finalState };
    }
    if (spec.acceptsPreflightFailure && uniqueCodes.includes('TRANSACTION_PREFLIGHT_FAILED')) {
      return { status: 'pass', detail: '已到达签名前预检查边界，因当前余额或费用条件阻断', codes: uniqueCodes, finalState };
    }
    const dependencyCodes = uniqueCodes.filter((code) => blockedAgentCodes.has(code) || code.endsWith('_UNAVAILABLE'));
    if (dependencyCodes.length) {
      return { status: 'blocked', detail: `依赖不可用：${dependencyCodes.join(', ')}`, codes: uniqueCodes, finalState };
    }
    if (result.error) {
      return { status: 'fail', detail: result.error.message || '请求失败', codes: uniqueCodes, finalState };
    }
    return {
      status: 'fail',
      detail: `未得到预期结果${uniqueCodes.length ? ` · ${uniqueCodes.join(', ')}` : ''}`,
      codes: uniqueCodes,
      finalState
    };
  }
  function testAddress() { return state.address || `0x${'1'.repeat(40)}`; }
  function testChain() { return state.chain || 'BASE'; }
  async function runSingleAgentTest(spec) {
    const chain = testChain();
    const address = testAddress();
    if (spec.requiresWallet && (!state.address || !state.chain)) {
      recordDebug(`AGENT TEST ${spec.id}`, {
        skipped: true,
        reason: 'wallet_not_connected',
        detail: '需要先连接浏览器钱包，再测试该能力。'
      });
      return {
        status: 'blocked',
        detail: '需要先连接浏览器钱包，再测试该能力。',
        codes: ['WALLET_NOT_CONNECTED'],
        events: []
      };
    }
    const extraMetadata = typeof spec.metadata === 'function' ? spec.metadata({ chain, address }) : {};
    const requestBody = {
      user_id: 'browser-demo',
      conversation_id: `agent-test-${Date.now()}-${spec.id}`,
      message: spec.message,
      address: spec.requiresWallet ? state.address : undefined,
      chain: spec.requiresWallet ? state.chain : undefined,
      metadata: { ...extraMetadata, agent_test_intent: spec.intent }
    };
    const controller = new AbortController();
    try {
      const turn = await api('/v1/agent/turn', {
        method: 'POST',
        headers: jsonHeaders(),
        body: JSON.stringify(requestBody)
      });
      const events = await readSse(turn.run_id, { apply: false, signal: controller.signal });
      const result = classifyAgentTest(spec, { turn, events });
      recordDebug(`AGENT TEST ${spec.id}`, { request: requestBody, turn, events, result });
      return { ...result, events };
    } catch (error) {
      const result = classifyAgentTest(spec, { error, events: [] });
      recordDebug(`AGENT TEST ${spec.id}`, { request: requestBody, error: error.message || String(error), result });
      return result;
    }
  }
  async function runAgentTests() {
    const button = $('runAgentTestsButton');
    button.disabled = true;
    $('agentTestPanel').open = true;
    state.agentTestResults = {};
    renderAgentTestList();
    updateAgentTestSummary();
    addSystem('开始测试全部 Agent 功能。真实签名、Approve 和广播不会自动执行。');
    try {
      for (const spec of agentTestSpecs) {
        state.agentTestResults[spec.id] = { status: 'running', detail: '正在请求后端并读取 SSE…' };
        renderAgentTestList();
        updateAgentTestSummary();
        state.agentTestResults[spec.id] = await runSingleAgentTest(spec);
        renderAgentTestList();
        updateAgentTestSummary();
      }
      const values = Object.values(state.agentTestResults);
      const passed = values.filter((item) => item.status === 'pass').length;
      const blocked = values.filter((item) => item.status === 'blocked').length;
      const failed = values.filter((item) => item.status === 'fail').length;
      addSystem(`Agent 功能测试完成：通过 ${passed}，阻塞 ${blocked}，失败 ${failed}。原始数据已写入调试面板。`);
    } finally {
      button.disabled = false;
    }
  }
  renderAgentTestList(); updateAgentTestSummary();
  $('connectButton').onclick = connectWallet; $('refreshButton').onclick = refreshSession; $('sendButton').onclick = sendMessage;
  $('debugSmokeButton').onclick = runDebugSmoke; $('debugClearButton').onclick = clearDebug;
  $('runAgentTestsButton').onclick = runAgentTests;
  $('composer').addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } });
  discoverWalletProviders(); updateMeta(); addMessage('assistant', '你好，我可以帮你查询余额、比较兑换报价，并准备未签名交易。先连接浏览器钱包，然后告诉我你想兑换什么。');
</script>
</body>
</html>
